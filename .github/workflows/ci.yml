name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "v2/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master]
    paths:
      - "v2/**"
      - ".github/workflows/**"

jobs:
  v2-tests:
    name: V2 unit + functional E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest -r backend/requirements-ci.txt

      - name: Prepare env
        run: |
          cp .env.example .env
          echo "DEV_MASTER_ENABLED=true" >> .env

      - name: Build and start stack
        run: docker compose up -d --build db cache api worker

      - name: Wait for API health
        run: |
          for i in $(seq 1 45); do
            curl -sf http://localhost:8002/health && exit 0
            sleep 2
          done
          docker compose logs api worker
          exit 1

      - name: Unit tests (offline)
        run: |
          cd backend && PYTHONPATH=src:tests python -m pytest \
            tests/test_access_control.py tests/test_security.py \
            tests/test_rbac_eval.py tests/test_golden_datasets.py \
            tests/test_eval_offline.py tests/test_dev_master.py \
            tests/test_config_security.py -v --tb=short

      - name: Functional E2E (CI_SKIP_LLM)
        env:
          CI_SKIP_LLM: "1"
        run: python scripts/e2e_functional_test.py

      - name: Logical eval offline (3x)
        run: |
          for i in 1 2 3; do python scripts/run_logical_eval.py --offline || exit 1; done

  v2-frontend:
    name: V2 frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

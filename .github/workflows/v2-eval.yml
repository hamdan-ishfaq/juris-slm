name: V2 Eval Harness

on:
  push:
    paths:
      - "v2/eval/**"
      - "v2/scripts/eval_common.py"
      - "v2/scripts/run_logical_eval.py"
      - "v2/scripts/run_ragas_eval.py"
      - "v2/scripts/run_latency_bench.py"
      - "v2/backend/src/**"
      - "v2/backend/tests/**"
      - ".github/workflows/v2-eval.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-eval.yml"
  schedule:
    - cron: "0 3 * * 1"

jobs:
  v2-eval-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval + test deps
        run: pip install pytest -r backend/requirements-base.txt

      - name: Security + golden unit tests
        run: |
          cd backend && PYTHONPATH=src:tests python -m pytest \
            tests/test_golden_datasets.py tests/test_eval_offline.py \
            tests/test_config_security.py tests/test_upload_security.py \
            tests/test_rag_guards.py tests/test_llm_routing.py tests/test_playbook.py -v --tb=short

      - name: Logical eval (offline, 3x)
        run: |
          for i in 1 2 3; do python scripts/run_logical_eval.py --offline || exit 1; done

      - name: Prepare stack for API eval
        run: |
          cp .env.example .env
          echo "DEV_MASTER_ENABLED=true" >> .env
          docker compose up -d --build db cache api worker

      - name: Wait for API
        run: |
          for i in $(seq 1 45); do
            curl -sf http://localhost:8002/health && exit 0
            sleep 2
          done
          exit 1

      - name: Production config guard (simulated)
        run: |
          docker compose exec -T api python -c "
          import os
          os.environ['ENVIRONMENT']='production'
          os.environ['DEV_MASTER_ENABLED']='true'
          from config import Settings
          from services.config_security import validate_settings
          import config
          config.settings = Settings()
          try:
              validate_settings()
              raise SystemExit('expected production validation failure')
          except RuntimeError:
              print('production guard OK')
          "

      - name: Latency benchmark (no LLM chat on CI)
        env:
          CI_SKIP_LLM: "1"
        run: python scripts/run_latency_bench.py

      - name: Unit subset
        run: |
          cd backend && PYTHONPATH=src:tests python -m pytest \
            tests/test_access_control.py tests/test_security.py \
            tests/test_golden_datasets.py -v --tb=short

      - name: Native RAGAS (skip if packages missing)
        env:
          CI_SKIP_LLM: "1"
        run: python scripts/run_native_ragas.py --limit 5 || true

      - name: Functional E2E (CI_SKIP_LLM)
        env:
          CI_SKIP_LLM: "1"
        run: python scripts/e2e_functional_test.py

# Embedding and reranking on the GPU, for bulk ingest and benchmarks with no LLM loaded.
# On a 6 GB GPU these models leave too little room for the LLM. See docs/DECISIONS.md, D-001.
# Usage: make up-gpu   (or: make gpu-build && make gpu-up)

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    environment:
      EMBEDDING_DEVICE: cuda
      RERANKER_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    environment:
      EMBEDDING_DEVICE: cuda
      RERANKER_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all

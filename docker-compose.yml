networks:
  juris_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: juris
      POSTGRES_PASSWORD: juris_password
      POSTGRES_DB: juris_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juris -d juris_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - juris_net

  cache:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - juris_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Enable BuildKit features
      args:
        BUILDKIT_INLINE_CACHE: 1
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./frontend/dist:/frontend/dist
      - ~/.cache/huggingface:/root/.cache/huggingface
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://juris:juris_password@db:5432/juris_db
      REDIS_URL: redis://cache:6379/0
      HF_HUB_OFFLINE: "0"  # Allow downloading models from HuggingFace
    # Better DNS for faster package downloads
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8001:8000"
    networks:
      - juris_net
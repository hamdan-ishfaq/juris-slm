services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: juris
      POSTGRES_PASSWORD: juris_password
      POSTGRES_DB: juris_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juris"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: juris-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://juris:juris_password@db:5432/juris_db
      REDIS_URL: redis://cache:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b-instruct-v0.3-q4_K_M}
      OLLAMA_AUX_MODEL: ${OLLAMA_AUX_MODEL:-qwen2.5:3b}
      LLM_AUX_PROVIDER: ${LLM_AUX_PROVIDER:-ollama}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-microsoft/phi-4-mini-instruct}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-your-secret-key-change-in-production}
      DEV_MASTER_ENABLED: ${DEV_MASTER_ENABLED:-false}
      DEV_MASTER_EMAIL: ${DEV_MASTER_EMAIL:-devmaster@example.com}
      DEV_MASTER_PASSWORD: ${DEV_MASTER_PASSWORD:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      EXPOSE_OPENAPI: ${EXPOSE_OPENAPI:-true}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      SCIM_ENABLED: ${SCIM_ENABLED:-true}
      RLS_ENABLED: ${RLS_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8002}
      GRAPH_EXTRACTION_ENABLED: ${GRAPH_EXTRACTION_ENABLED:-true}
      QUERY_CACHE_ENABLED: ${QUERY_CACHE_ENABLED:-true}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      EMBEDDING_MODEL_PATH: /app/data/models/bge-m3
      RERANKER_MODEL_PATH: /app/data/models/reranker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
      - uploads_data:/app/src/data/uploads
      - hf_cache:/home/juris/.cache/huggingface
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app/src"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://juris:juris_password@db:5432/juris_db
      REDIS_URL: redis://cache:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b-instruct-v0.3-q4_K_M}
      OLLAMA_AUX_MODEL: ${OLLAMA_AUX_MODEL:-qwen2.5:3b}
      LLM_AUX_PROVIDER: ${LLM_AUX_PROVIDER:-ollama}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-microsoft/phi-4-mini-instruct}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      GRAPH_EXTRACTION_ENABLED: ${GRAPH_EXTRACTION_ENABLED:-true}
      QUERY_CACHE_ENABLED: ${QUERY_CACHE_ENABLED:-true}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      EMBEDDING_MODEL_PATH: /app/data/models/bge-m3
      RERANKER_MODEL_PATH: /app/data/models/reranker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data
      - uploads_data:/app/src/data/uploads
      - hf_cache:/home/juris/.cache/huggingface
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--pool=solo"]

volumes:
  postgres_data:
  uploads_data:
  hf_cache:
  ollama_data:

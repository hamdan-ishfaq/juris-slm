# config.yaml - JurisGuard runtime configuration
# Secrets (AUTH_SECRET_KEY, DATABASE_URL) must be set via environment variables.
# Never put real secrets in this file.

# Model Configuration
models:
  embedding_model: "all-MiniLM-L6-v2"
  llm_model: "mistralai/Mistral-7B-Instruct-v0.3"
  classifier_model: "facebook/bart-large-mnli"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  load_in_4bit: true
  max_seq_length: 4096
  embedding_device: "cpu"
  reranker_device: "cpu"

# Paths (relative to /app inside Docker)
paths:
  faiss_db: "data/juris_faiss_db"
  config_file: "config/config.yaml"

# Security Configuration
security:
  hard_patterns:
    - { name: "project_chimera", pattern: "\\bProject\\s+Chimera\\b", flags: "IGNORECASE", tag: "project_chimera" }
    - { name: "ssn", pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b", flags: "", tag: "ssn" }
    - { name: "credit_card", pattern: "\\b(?:\\d[ -]*?){13,16}\\b", flags: "", tag: "credit_card" }
    - { name: "confidential", pattern: "\\bconfidential\\b", flags: "IGNORECASE", tag: "confidential" }
  sensitive_keywords: ["confidential", "proprietary", "trade secret", "internal use only"]
  public_keywords: ["public", "published", "policy"]
  similarity_threshold: 0.35
  sentinel_threshold: 0.85

# Ingestion Configuration
ingestion:
  chunk_size: 500
  chunk_overlap: 150

# Query Configuration
query:
  top_k: 5
  max_new_tokens: 512
  temperature: 0.3
  top_p: 0.9

# API Configuration
# Origins are read from ALLOWED_ORIGINS env var (comma-separated list).
# Fallback below is for local Docker-only development.
# For ngrok: set ALLOWED_ORIGINS=https://your-ngrok-url.ngrok-free.app in backend/.env
api:
  origins:
    - "http://localhost:5173"
    - "http://localhost:8001"
    - "http://127.0.0.1:5173"
  port: 8000

# Authentication Configuration
# SECRET KEY: set AUTH_SECRET_KEY environment variable — do not put it here.
auth:
  secret_key: "placeholder-overridden-by-env"
  algorithm: "HS256"
  access_token_expire_minutes: 60
  database_url: "postgresql+asyncpg://juris:juris_password@db:5432/juris_db"
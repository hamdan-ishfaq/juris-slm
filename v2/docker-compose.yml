version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: juris
      POSTGRES_PASSWORD: juris_password
      POSTGRES_DB: juris_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juris"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://juris:juris_password@db:5432/juris_db
      REDIS_URL: redis://cache:6379/0
      OLLAMA_BASE_URL: http://172.25.16.1:11434
      OLLAMA_MODEL: phi3.5
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
